name: Daily Run Cycle

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 10:00am ET (UTC-4 summer) Mon-Fri
    - cron: '0 15 * * 1-5'   # 10:00am ET (UTC-5 winter) Mon-Fri
  workflow_dispatch:           # allow manual trigger from GitHub Actions tab

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-base-v1

      - name: Install dependencies
        run: uv sync

      - name: Clone shiyu-coder Kronos backbone
        run: git clone --depth=1 https://github.com/shiyu-coder/Kronos.git vendor/sy_kronos

      - name: Install Kronos vendor dependencies
        run: |
          if [ -f vendor/sy_kronos/requirements.txt ]; then
            uv pip install -r vendor/sy_kronos/requirements.txt
          fi
          echo "=== vendor/sy_kronos contents ==="
          ls vendor/sy_kronos/

      - name: Smoke-test sy-kronos import
        run: |
          uv run python - <<'PY'
          import sys, traceback
          sys.path.insert(0, "vendor/sy_kronos")
          print("sys.path[0]:", sys.path[0])
          try:
              from model import Kronos, KronosTokenizer, KronosPredictor
              print("OK: sy-kronos imports succeeded")
          except Exception:
              print("FAILED: sy-kronos import error:")
              traceback.print_exc()
          PY

      - name: Run cycle (intraday mode)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:         ${{ secrets.ALPACA_PAPER }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          KRONOS_CACHE_DIR:     ./data/kronos_cache
          AUDIT_LOG_DIR:        ./logs/audit
        run: uv run python main.py --mode intraday

      - name: Collect options data
        if: always()
        run: uv run python data/options_collector.py

      - name: Collect insider transactions
        if: always()
        run: uv run python data/insider.py

      - name: Commit audit log to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/audit/ logs/forward_sim.json
          git diff --cached --quiet || git commit -m "chore: daily audit log $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: logs/audit/
          retention-days: 30

      - name: Upload options + insider data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          path: |
            logs/options_data.json
            logs/insider_data.json
          retention-days: 30
