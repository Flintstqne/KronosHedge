name: Daily Run Cycle

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 10:00am ET (UTC-4 summer) Mon-Fri
    - cron: '0 15 * * 1-5'   # 10:00am ET (UTC-5 winter) Mon-Fri
  workflow_dispatch:           # allow manual trigger from GitHub Actions tab

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run cycle (intraday mode)
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER:         ${{ secrets.ALPACA_PAPER }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          KRONOS_CACHE_DIR:     ./data/kronos_cache
          AUDIT_LOG_DIR:        ./logs/audit
        run: uv run python main.py --mode intraday

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: logs/audit/
          retention-days: 30
