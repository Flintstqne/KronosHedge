universe:
  source: custom_list
  max_tickers: 31
  tickers:
  - AAPL
  - ABBV
  - AMZN
  - AVGO
  - CAT
  - COST
  - CVX
  - GOOGL
  - GS
  - HD
  - HON
  - JNJ
  - JPM
  - LIN
  - LLY
  - MA
  - MCD
  - META
  - MSFT
  - NEE
  - NFLX
  - NVDA
  - PG
  - RTX
  - SPCX
  - T
  - TSLA
  - UNH
  - V
  - WMT
  - XOM
sector_map:
  AAPL: Technology
  MSFT: Technology
  NVDA: Technology
  GOOGL: Technology
  META: Technology
  AVGO: Technology
  AMZN: Consumer Discretionary
  TSLA: Consumer Discretionary
  HD: Consumer Discretionary
  MCD: Consumer Discretionary
  UNH: Healthcare
  LLY: Healthcare
  JNJ: Healthcare
  ABBV: Healthcare
  JPM: Financials
  V: Financials
  MA: Financials
  GS: Financials
  XOM: Energy
  CVX: Energy
  CAT: Industrials
  RTX: Industrials
  HON: Industrials
  COST: Consumer Staples
  WMT: Consumer Staples
  PG: Consumer Staples
  NFLX: Communication Services
  T: Communication Services
  LIN: Materials
  NEE: Utilities
  SPCX: ETF
sector_filter:
  enabled: true
  max_sector_pct: 0.4
  max_per_sector: 4
kronos:
  model_size: base
  model_source: sy-kronos
  horizon: 5
  device: cpu
  batch_size: 16
  lookback_days: 60
agents:
  llm_provider: anthropic
  llm_model: claude-sonnet-4-6
  max_concurrent: 4
  enabled:
  - technicals
  - valuation
  - sentiment
  - fundamentals
  - risk_manager
  - portfolio_manager
  - warren_buffett
  - peter_lynch
  - charlie_munger
  - benjamin_graham
  - george_soros
alpha:
  momentum_blend: 0.8
  top_n: 10
  short_n: 3
  pead_boost: 0.2
risk:
  trailing_stop: 0.07
  drawdown_stop: 0.07
  recovery_threshold: 0.02
  cash_reserve_pct: 0.25
  spy_reserve: true
  vix_threshold: 25
  stop_cooldown_days: 2
reconciliation:
  qlib_weight: 0.6
  agent_weight: 0.4
execution:
  broker: alpaca
  paper: true
  max_position_pct: 0.05
  min_order_usd: 100
  twap_intervals: 5
  intraday_signal_time: '10:00'
  intraday_execution_delay: 15
regime:
  enabled: true
  yield_curve_threshold: -0.5
  hyg_momentum_threshold: -0.02
  spy_trend_threshold: -0.05
  transition_scale: 0.8
  risk_off_scale: 0.5
forward_sim:
  n_paths: 64
  horizon: 21
monitoring:
  audit_log_path: ./logs/audit
  dashboard_port: 8501
  alert_drawdown_threshold: -0.05
  benchmark_ticker: SPY
qlib:
  freq: day
  start_date: '2020-01-01'
  fit_start_date: '2020-01-01'
  fit_end_date: '2023-12-31'
